<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>My To-Do List 📝</h1>
        <p class="subtitle">Organize your day, one task at a time.</p>

        <form id="task-form">
            <input type="text" id="task-input" placeholder="Enter a new task..."
                   autocomplete="off" required>
            <button type="submit">Add Task</button>
        </form>

        <div class="task-info">
            <span id="task-count">0 tasks remaining</span>
            <button id="clear-completed" type="button">Clear completed</button>
        </div>

        <ul id="task-list"></ul>
        <p id="empty-message">No tasks yet. Add your first task!</p>
    </div>
</body>
</html>
